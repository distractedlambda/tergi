[package]
name = "tergi"
version = "0.1.0"
edition = "2024"
description = "Yet another terminal git client"
license = "MIT"
readme = "README.md"
# The integration tests are modules of tests/main.rs, so they build into
# one binary.
autotests = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
etcetera = "0.11"
bstr = "1.13"
imara-diff = "0.2"
logos = "0.16"
notify = "8"
redb = "5"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
shlex = "2"
signal-hook = "0.4"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time", "sync", "fs"] }
tokio-stream = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[[test]]
name = "integration"
path = "tests/main.rs"

[dev-dependencies]
insta = "1"
proptest = "1"
pulldown-cmark = { version = "0.13", default-features = false }
saphyr-parser = "0.3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
# Logos lexers often give two patterns the same callback, which this
# lint mistakes for a repeated attribute.
duplicated_attributes = "allow"

[profile.dev]
opt-level = 1
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "s"
strip = true
debug = true
split-debuginfo = "packed"
