[package]
name = "tergi"
version = "0.1.0"
edition = "2024"
description = "A terminal git client inspired by Sublime Merge"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
etcetera = "0.11"
gix = { version = "0.90", default-features = false, features = ["max-performance", "basic", "sha1", "mailmap"] }
imara-diff = "0.2"
notify = "8"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
shlex = "2"
signal-hook = "0.4"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time", "sync", "fs"] }
tokio-stream = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
insta = "1"
proptest = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"

[profile.dev]
panic = "abort"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
