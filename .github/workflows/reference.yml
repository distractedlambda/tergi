name: Reference lexers

# Compares tergi's lexers with the real ones, through the scripts in
# dev/reference. Each check builds its own images and fetches its own
# corpus, which takes a while, so this only runs when something they
# depend on changes.
on:
  push:
    paths:
      - "src/highlight/**"
      - "dev/**"
      - "Cargo.lock"
      - ".github/workflows/reference.yml"
  pull_request:
    paths:
      - "src/highlight/**"
      - "dev/**"
      - "Cargo.lock"
      - ".github/workflows/reference.yml"
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        name: [c, cmake, javascript, llvm, python, racket, shrubbery, yaml, zig]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # run.sh uses podman by default, but here it runs docker, whose
      # buildx can keep the layers of each image in the Actions cache.
      # Buildx reads the cache's address and token from variables that
      # GitHub only gives to actions, so the second step exposes them to
      # run.sh.
      - uses: docker/setup-buildx-action@v4
        id: buildx
      - uses: crazy-max/ghaction-github-runtime@v4
      - run: dev/reference/run.sh ${{ matrix.name }}
        env:
          PODMAN: docker
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          TERGI_REFERENCE_CACHE: type=gha
