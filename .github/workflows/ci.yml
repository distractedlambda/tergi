name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep this the same as the Rust version in dev/Containerfile. Otherwise
  # a different rustfmt can make tests/fmt.rs fail here but not locally.
  RUST_VERSION: "1.100.0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # The tests make commits in scratch repositories. Tests that need
      # reftable skip themselves if git is older than 2.45, so print the
      # version to make that easy to spot.
      - name: Set up git
        run: |
          git config --global user.name "Test User"
          git config --global user.email "test@example.com"
          git config --global init.defaultBranch main
          git --version
      - run: cargo test --locked

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            debuginfo: tergi.dSYM
          # The release build has no C code, and .cargo/config.toml links
          # musl targets with rust-lld, so both cross-compile from x86_64.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            debuginfo: tergi.dwp
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            debuginfo: tergi.dwp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --profile dist --target ${{ matrix.target }}
      # Artifacts lose the executable bit, so we pack the files in tarballs.
      # The debug info goes in its own artifact because it's ten times the
      # size of the binary. Cargo may leave symlinks here that point into
      # its build directory, as it does for tergi.dSYM, so tar follows
      # them with -h.
      - name: Pack
        working-directory: target/${{ matrix.target }}/dist
        run: |
          tar czhf "$GITHUB_WORKSPACE/tergi-${{ matrix.target }}.tar.gz" tergi
          tar czhf "$GITHUB_WORKSPACE/tergi-${{ matrix.target }}-debuginfo.tar.gz" ${{ matrix.debuginfo }}
      - uses: actions/upload-artifact@v7
        with:
          name: tergi-${{ matrix.target }}
          path: tergi-${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: tergi-${{ matrix.target }}-debuginfo
          path: tergi-${{ matrix.target }}-debuginfo.tar.gz
          if-no-files-found: error

  # Makes a prerelease for each push to main, tagged with its commit.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tergi-*
          path: dist
          merge-multiple: true
      - name: Make the release
        run: |
          short="${GITHUB_SHA::12}"
          tag="build-$short"
          # The notes list the commits in the push, newest first, the way
          # git log does.
          {
            echo "Built from $GITHUB_SHA."
            commits=$(jq -r '.commits | reverse | .[]
              | "- \(.id[0:12]) \(.message | split("\n")[0])"' "$GITHUB_EVENT_PATH")
            if [ -n "$commits" ]; then
              printf '\nCommits in this push:\n\n%s\n' "$commits"
            fi
          } > notes.md
          # If the job runs again, the release is already there, so we
          # replace its files.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "Build $short" --notes-file notes.md
          fi
